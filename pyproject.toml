[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "te-density"
version = "2.1.1"
description = "Calculates Transposable Element density"
readme = "README.md"
requires-python = ">=3.11,<=3.12"
license = { text = "GPL-3.0" }
authors = [{ name = "Scott Teresi" }, { name = "Michael Teresi" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
  "coloredlogs==15.0.1",
  "h5py==3.8.0",
  "matplotlib==3.6.2",
  "numexpr==2.8.4",
  "numpy==1.24.2",
  "pandas==1.5.2",
  "scipy==1.9.3",
  "tqdm==4.65.0",
]

[project.urls]
Homepage = "https://github.com/sjteresi/TE_Density"

[tool.setuptools]
packages = ["transposon"]
py-modules = ["process_genome"]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "build>=1.6.1",
    "pytest>=7.4.4",
]

[project.scripts]
process_genome = "process_genome:main"
